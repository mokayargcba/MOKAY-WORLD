  function drawWorldMapModal() {
    const mc = document.getElementById('worldMapCanvas');
    if (!mc) return;
    const dpr = Math.min(2.5, Math.max(window.devicePixelRatio || 1, 2));
    const w = mc.clientWidth;
    const h = mc.clientHeight;
    mc.width = Math.floor(w * dpr);
    mc.height = Math.floor(h * dpr);
    const g = mc.getContext('2d');
    g.scale(dpr, dpr);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';

    g.fillStyle = '#0F1B2B';
    g.fillRect(0, 0, w, h);

    // Draw links
    g.lineWidth = 2.5;
    for (const [aId, bId] of MAP_LINKS) {
      const a = REGIONS[aId], b = REGIONS[bId];
      const both = state.discoveredRegions.includes(aId) && state.discoveredRegions.includes(bId);
      g.strokeStyle = both ? 'rgba(224,169,79,0.7)' : 'rgba(183,176,230,0.22)';
      g.beginPath();
      g.moveTo(a.mapX * w, a.mapY * h);
      g.lineTo(b.mapX * w, b.mapY * h);
      g.stroke();
    }

    // Draw nodes
    const nodes = Object.values(REGIONS);
    for (const reg of nodes) {
      const x = reg.mapX * w;
      const y = reg.mapY * h;
      const disc = state.discoveredRegions.includes(reg.id);
      const cur = state.regionId === reg.id;
      g.beginPath();
      g.arc(x, y, cur ? 13 : 10, 0, Math.PI * 2);
      g.fillStyle = cur ? '#FF6A3D' : disc ? reg.accent : '#2E2B42';
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = cur ? '#FFC24D' : '#1A1A1A';
      g.stroke();

      g.font = 'bold 10px system-ui';
      g.textAlign = 'center';
      g.fillStyle = disc ? '#F4E7D1' : 'rgba(183,176,230,0.5)';
      g.fillText(reg.title, x, y + 21);
    }

    mc.onclick = ev => {
      const rect = mc.getBoundingClientRect();
      const cx = ev.clientX - rect.left;
      const cy = ev.clientY - rect.top;
      for (const reg of nodes) {
        if (Math.hypot(reg.mapX * w - cx, reg.mapY * h - cy) <= 22) {
          if (state.discoveredRegions.includes(reg.id)) {
            state.px = 900; state.py = 740;
            spawnRegion(reg.id, false);
            closeModal();
            showToast(`Viajaste a ${reg.title}`);
          } else {
            showToast('Aún no has descubierto esta región.');
          }
          break;
        }
      }
    };
  }

  // CANVAS 2D GAME RENDERER (Original Boxy + Foskay Inside Box + Cuphead/Zelda World)
  function drawBoxy(x, y, phase, dir, actionKind, actionT, exhausted, foskayOut, hurtT = 0, flashT = 0, invulnT = 0, isRunning = false) {
    ctx.save();
    const isHurt = hurtT > 0;
    const isFlash = flashT > 0;
    const hurtP = isHurt ? Math.min(1, hurtT / 0.34) : 0;
    const jitterX = isHurt ? Math.sin(hurtP * 46) * 4.5 * hurtP : 0;
    ctx.translate(x + jitterX, y);
    if (!isFlash && invulnT > 0 && isHurt && Math.floor(invulnT * 22) % 2 === 0) {
      ctx.globalAlpha = 0.48;
    }

    const runMul = isRunning && actionKind === 'walk' ? 1.7 : 1.0;
    const bounce = actionKind === 'walk' ? Math.abs(Math.sin(phase * 2.2 * runMul)) * (isRunning ? 7.2 : 4.5) : Math.sin(phase) * 1.6;
    const scaleX = isHurt ? 1 + 0.20 * hurtP : actionKind === 'attack' ? 1.15 : isRunning ? 1.05 : 1.0;
    const scaleY = isHurt ? 1 - 0.18 * hurtP : actionKind === 'attack' ? 0.9 : isRunning ? 0.95 : 1.0;

    // Sprint speed-lines behind Boxy
    if (isRunning && actionKind === 'walk' && !isHurt) {
      const [sdx, sdy] = dirVector(dir);
      ctx.strokeStyle = 'rgba(255, 246, 225, 0.58)';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-sdx * 24 - sdy * 8, 6 - sdy * 20);
      ctx.lineTo(-sdx * 40 - sdy * 8, 6 - sdy * 34);
      ctx.moveTo(-sdx * 22 + sdy * 8, 16 - sdy * 18);
      ctx.lineTo(-sdx * 36 + sdy * 8, 16 - sdy * 30);
      ctx.stroke();
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 26, 20 * scaleX, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.translate(0, -bounce);
    if (isHurt) ctx.rotate(Math.sin(hurtP * 24) * 0.14 * hurtP);
    else if (isRunning && actionKind === 'walk') {
      const [ldx] = dirVector(dir);
      ctx.rotate(ldx * 0.10);
    }
    ctx.scale(scaleX, scaleY);

    // Classic Cartoon Shoes
    const stride = actionKind === 'walk' ? Math.sin(phase * 2.5 * runMul) * (isRunning ? 9 : 6) : 0;
    ctx.fillStyle = isFlash ? '#FFFFFF' : '#F4E7D1';
    ctx.strokeStyle = '#1A1A1A';
    ctx.lineWidth = 2.4;
    [-9, 9].forEach((sx, idx) => {
      ctx.beginPath();
      ctx.ellipse(sx, 20 + (idx === 0 ? stride : -stride) * 0.4, 7.5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    });

    // Boxy Cardboard Torso (#B7B0E6 + #6E69A6 depth + crisp top bevel)
    ctx.fillStyle = isFlash ? (Math.floor(flashT * 30) % 2 === 0 ? '#FFFFFF' : '#FF8A8A') : '#B7B0E6';
    ctx.beginPath();
    ctx.roundRect(-20, -18, 40, 36, 7);
    ctx.fill();
    ctx.stroke();

    // Soft cel-highlight along top-left edge
    if (!isFlash) {
      ctx.fillStyle = 'rgba(255,255,255,0.26)';
      ctx.beginPath();
      ctx.roundRect(-18, -16, 26, 6, 3);
      ctx.fill();

      // Right side fold shadow
      ctx.fillStyle = '#6E69A6';
      ctx.beginPath();
      ctx.roundRect(10, -17, 9, 34, 4);
      ctx.fill();
    }

    // Top Box Flap (opens when Foskay emerges!)
    const flapLift = foskayOut > 0 ? 11 : isHurt ? 6 : 3;
    ctx.fillStyle = isFlash ? '#FFFFFF' : '#C9C3F0';
    ctx.beginPath();
    ctx.moveTo(-20, -18);
    ctx.lineTo(-14, -18 - flapLift);
    ctx.lineTo(14, -18 - flapLift);
    ctx.lineTo(20, -18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Foskay inside the top of the box!
    if (foskayOut > 0) {
      const flicker = Math.sin(phase * 5) * 2;
      const grad = ctx.createRadialGradient(0, -25, 2, 0, -25, 24);
      grad.addColorStop(0, 'rgba(255,194,77,0.95)');
      grad.addColorStop(0.5, 'rgba(255,106,61,0.55)');
      grad.addColorStop(1, 'rgba(255,106,61,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, -25, 24, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF6A3D';
      ctx.beginPath();
      ctx.moveTo(-7, -18);
      ctx.quadraticCurveTo(-9, -32, 0 + flicker * 0.4, -38 - flicker);
      ctx.quadraticCurveTo(9, -32, 7, -18);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#FFC24D';
      ctx.beginPath();
      ctx.arc(0, -24, 4, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Subtle ember peek inside box seam
      ctx.fillStyle = '#FF6A3D';
      ctx.beginPath();
      ctx.arc(0, -20, 4.5, Math.PI, 0);
      ctx.fill();
    }

    // Face (unless facing back)
    if (dir !== 'back') {
      const lookX = dir === 'left' ? -5 : dir === 'right' ? 5 : 0;
      if (isHurt) {
        // Cartoon wincing "> <" hurt eyes + stunned mouth
        ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-10 + lookX, -8); ctx.lineTo(-3.5 + lookX, -4); ctx.lineTo(-10 + lookX, 0);
        ctx.moveTo(10 + lookX, -8); ctx.lineTo(3.5 + lookX, -4); ctx.lineTo(10 + lookX, 0);
        ctx.stroke();
        ctx.fillStyle = '#1A1A1A';
        ctx.beginPath(); ctx.ellipse(lookX, 6.5, 3.8, 4.4, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.ellipse(-6 + lookX, -4, 4.5, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(6 + lookX, -4, 4.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#1A1A1A';
        ctx.beginPath();
        ctx.arc(-5 + lookX * 1.2, -3, 2.3, 0, Math.PI * 2);
        ctx.arc(7 + lookX * 1.2, -3, 2.3, 0, Math.PI * 2);
        ctx.fill();

        // Cuphead-style glossy eye glints
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(-5.8 + lookX * 1.2, -4.1, 0.95, 0, Math.PI * 2);
        ctx.arc(6.2 + lookX * 1.2, -4.1, 0.95, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        if (exhausted) {
          ctx.arc(lookX, 7, 4, Math.PI, 0);
        } else {
          ctx.arc(lookX, 5, 4.5, 0, Math.PI);
        }
        ctx.stroke();
      }
    }

    // Cartoon White Gloves
    const punch = actionKind === 'attack' ? 14 : 0;
    const [dx, dy] = dirVector(dir);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(-22 + dx * punch * 0.4, 2 + dy * punch * 0.4, 5.5, 0, Math.PI * 2);
    ctx.arc(22 + dx * punch, 2 + dy * punch, actionKind === 'attack' ? 7.5 : 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function stepSimulation(dt) {
    const reg = REGIONS[state.regionId];
    runtime.animPhase = (runtime.animPhase + dt * 5.5) % (Math.PI * 20);
    runtime.invulnTimer = Math.max(0, runtime.invulnTimer - dt);
    runtime.hitFlashTimer = Math.max(0, runtime.hitFlashTimer - dt);
    runtime.boxyHurtTimer = Math.max(0, runtime.boxyHurtTimer - dt);
    runtime.shakeTimer = Math.max(0, runtime.shakeTimer - dt);
    if (runtime.shakeTimer === 0) runtime.shakeMag = 0;
    runtime.foskayTimer = Math.max(0, runtime.foskayTimer - dt);
    runtime.foskayLightTimer = Math.max(0, runtime.foskayLightTimer - dt);
    state.mana = Math.min(state.maxMana, state.mana + dt * 2.4);

    if (runtime.toastTimer > 0) {
      runtime.toastTimer -= dt;
      if (runtime.toastTimer <= 0) document.getElementById('toastBanner').classList.remove('visible');
    }

    runtime.particles = runtime.particles.filter(p => {
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      return p.life > 0;
    });
    runtime.banners = runtime.banners.filter(b => {
      b.life -= dt; b.y -= 24 * dt;
      return b.life > 0;
    });

    if (runtime.modalOpen) return;

    // Apply damped Boxy knockback
    if (Math.abs(runtime.boxyKx) > 1 || Math.abs(runtime.boxyKy) > 1) {
      state.px = Math.max(55, Math.min(WORLD_W - 55, state.px + runtime.boxyKx * dt));
      state.py = Math.max(55, Math.min(WORLD_H - 55, state.py + runtime.boxyKy * dt));
      const damp = Math.exp(-10 * dt);
      runtime.boxyKx *= damp;
      runtime.boxyKy *= damp;
    } else {
      runtime.boxyKx = 0; runtime.boxyKy = 0;
    }

    if (runtime.actionTimer > 0) {
      runtime.actionTimer = Math.max(0, runtime.actionTimer - dt);
      if (runtime.actionKind === 'dodge') {
        const [dx, dy] = dirVector(state.dir);
        state.px = Math.max(60, Math.min(WORLD_W - 60, state.px + dx * 410 * dt));
        state.py = Math.max(60, Math.min(WORLD_H - 60, state.py + dy * 410 * dt));
      }
      if (runtime.actionTimer === 0) runtime.actionKind = 'idle';
    } else {
      let mx = joyVec.x;
      let my = joyVec.y;
      if (keys.KeyA || keys.ArrowLeft) mx -= 1;
      if (keys.KeyD || keys.ArrowRight) mx += 1;
      if (keys.KeyW || keys.ArrowUp) my -= 1;
      if (keys.KeyS || keys.ArrowDown) my += 1;
      const mag = Math.hypot(mx, my);
      if (mag > 0.08) {
        const wantsRun = !state.exhausted && state.stam > 2 && (runtime.runToggle || keys.ShiftLeft || keys.ShiftRight);
        runtime.isRunning = wantsRun;
        const spd = state.exhausted ? 132 : wantsRun ? 425 : 268;
        const nx = (mx / Math.max(1, mag)) * spd * dt;
        const ny = (my / Math.max(1, mag)) * spd * dt;
        state.px = Math.max(55, Math.min(WORLD_W - 55, state.px + nx));
        state.py = Math.max(55, Math.min(WORLD_H - 55, state.py + ny));
        runtime.actionKind = 'walk';
        if (Math.abs(mx) > Math.abs(my)) state.dir = mx < 0 ? 'left' : 'right';
        else state.dir = my < 0 ? 'back' : 'front';
        if (wantsRun) {
          state.stam = Math.max(0, state.stam - dt * 13.5);
          if (state.stam <= 0) {
            state.exhausted = true;
            runtime.runToggle = false;
            runtime.isRunning = false;
          }
          runtime.runDustCd = Math.max(0, (runtime.runDustCd || 0) - dt);
          if (runtime.runDustCd <= 0) {
            runtime.runDustCd = 0.09;
            addParticles(state.px, state.py + 22, '#F4E7D1', 2);
          }
        }
      } else {
        runtime.isRunning = false;
        runtime.actionKind = 'idle';
        state.stam = Math.min(state.maxStam, state.stam + dt * 13);
        if (state.exhausted && state.stam >= 24) state.exhausted = false;
      }
    }

    // House collision push-out
    for (const h of reg.houses) {
      const hw = h.w * 0.45, hh = h.h * 0.36;
      const dx = state.px - h.x, dy = state.py - h.y;
      if (Math.abs(dx) < hw && Math.abs(dy) < hh) {
        if (hw - Math.abs(dx) < hh - Math.abs(dy)) state.px = h.x + (dx >= 0 ? hw : -hw);
        else state.py = h.y + (dy >= 0 ? hh : -hh);
      }
    }

    // Landmarks & Villages auto-discovery
    let nearestLm = reg.landmarks[0]?.name || reg.title;
    let bestD = Infinity;
    for (const lm of reg.landmarks) {
      const d = Math.hypot(lm.x - state.px, lm.y - state.py);
      if (d < bestD) { bestD = d; nearestLm = lm.name; }
      if (d <= lm.r + 75 && !state.discoveredLandmarks.includes(lm.id)) {
        state.discoveredLandmarks.push(lm.id);
        showToast(`📍 Descubierto: ${lm.name}`);
        evaluateAchievements();
        saveGame(false);
      }
    }
    document.getElementById('hudLandmark').textContent = nearestLm;

    // Pickups & Books
    for (const pk of reg.pickups) {
      if (state.collectedPickups.includes(pk.id)) continue;
      if (Math.hypot(pk.x - state.px, pk.y - state.py) <= 44) {
        state.collectedPickups.push(pk.id);
        state.inventory[pk.itemId] = (state.inventory[pk.itemId] || 0) + 1;
        state.chispas += 8;
        if (pk.bookId && !state.books.includes(pk.bookId)) {
          const bk = BOOKS[pk.bookId];
          state.books.push(pk.bookId);
          if (bk.keyword && !state.keywords.includes(bk.keyword)) state.keywords.push(bk.keyword);
          if (bk.force && !state.forces.includes(bk.force)) state.forces.push(bk.force);
          AudioManager.playInteract('book');
          showToast(`📖 ¡Libro: ${bk.title} (Clave: ${bk.keyword})!`);
        } else {
          AudioManager.playInteract('pickup');
          showToast(`+${ITEMS[pk.itemId].name} (+8 ✨)`);
        }
        evaluateAchievements();
        saveGame(false);
      }
    }

    // Enemies update
    for (const en of runtime.enemies) {
      en.flash = Math.max(0, en.flash - dt);
      en.hitAnim = Math.max(0, (en.hitAnim || 0) - dt);
      en.cd = Math.max(0, en.cd - dt);

      if (Math.abs(en.kx) > 1 || Math.abs(en.ky) > 1) {
        en.x = Math.max(55, Math.min(WORLD_W - 55, en.x + en.kx * dt));
        en.y = Math.max(55, Math.min(WORLD_H - 55, en.y + en.ky * dt));
        const eDamp = Math.exp(-9 * dt);
        en.kx *= eDamp;
        en.ky *= eDamp;
      } else {
        en.kx = 0; en.ky = 0;
      }

      const dist = Math.hypot(state.px - en.x, state.py - en.y);
      if (dist > 34 && dist < 440 && (en.hitAnim || 0) <= 0.08) {
        en.x += ((state.px - en.x) / dist) * en.speed * dt;
        en.y += ((state.py - en.y) / dist) * en.speed * dt;
      }
      if (dist <= 44 && en.cd <= 0 && runtime.invulnTimer <= 0) {
        en.cd = 1.15;
        runtime.invulnTimer = 0.72;
        runtime.hitFlashTimer = 0.24;
        runtime.boxyHurtTimer = 0.34;
        runtime.shakeTimer = 0.20;
        runtime.shakeMag = 7;
        const kDist = Math.max(1, dist);
        runtime.boxyKx = ((state.px - en.x) / kDist) * 330;
        runtime.boxyKy = ((state.py - en.y) / kDist) * 330;
        vibrate(24);
        addParticles(state.px, state.py, '#FF595E', 10);
        state.hp = Math.max(10, state.hp - en.dmg);
        AudioManager.playInteract('damage');
        if (state.hp <= 10) {
          state.hp = Math.floor(state.maxHp * 0.65);
          state.px = 900; state.py = 740;
          runtime.boxyKx = 0; runtime.boxyKy = 0;
          showToast('Foskay rescató a Boxy antes de caer.');
        } else {
          addBanner(`-${en.dmg} HP`, state.px, state.py - 28, '#D94E4E');
        }
      }
    }

    // Proximity NPC & Gate & Village
    runtime.nearbyNpc = reg.npcs.find(n => Math.hypot(n.x - state.px, n.y - state.py) <= 88) || null;
    if (runtime.nearbyNpc && runtime.nearbyNpc.village && !state.visitedVillages.includes(runtime.nearbyNpc.village)) {
      state.visitedVillages.push(runtime.nearbyNpc.village);
      evaluateAchievements();
      saveGame(false);
    }
    runtime.nearbyGate = reg.gates.find(g => Math.hypot(g.x - state.px, g.y - state.py) <= 82) || null;
  }

  function shadeHex(hex, factor = 0.75) {
    if (!hex || !hex.startsWith('#') || (hex.length !== 7 && hex.length !== 4)) return hex || '#444444';
    const full = hex.length === 4 ? '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3] : hex;
    const r = Math.min(255, Math.max(0, Math.round(parseInt(full.slice(1, 3), 16) * factor)));
    const g = Math.min(255, Math.max(0, Math.round(parseInt(full.slice(3, 5), 16) * factor)));
    const b = Math.min(255, Math.max(0, Math.round(parseInt(full.slice(5, 7), 16) * factor)));
    return `rgb(${r},${g},${b})`;
  }

  function drawSmoothFlame(x, y, w, h, outerCol = '#FF6A3D', innerCol = '#FFC24D') {
    const safeH = Math.min(48, Math.max(10, h));
    const f = Math.sin(runtime.animPhase * 4.8 + x * 0.05) * (w * 0.16);
    ctx.save();
    // Soft outer glow
    const g = ctx.createRadialGradient(x, y - safeH * 0.25, 2, x, y - safeH * 0.25, w * 1.15);
    g.addColorStop(0, innerCol + '55');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - safeH * 0.25, w * 1.15, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = outerCol;
    ctx.strokeStyle = '#1A1A1A';
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.46, y + safeH * 0.25);
    ctx.quadraticCurveTo(x - w * 0.58, y - safeH * 0.32, x + f * 0.45, y - safeH * 0.78);
    ctx.quadraticCurveTo(x + w * 0.58, y - safeH * 0.32, x + w * 0.46, y + safeH * 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = innerCol;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.24, y + safeH * 0.18);
    ctx.quadraticCurveTo(x - w * 0.28, y - safeH * 0.18, x + f * 0.2, y - safeH * 0.48);
    ctx.quadraticCurveTo(x + w * 0.28, y - safeH * 0.18, x + w * 0.24, y + safeH * 0.18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawFloatingIslets(reg, animPhase, w, h) {
    const islets = [
      [84, 118, 44, 0.2, 'tower'], [w - 86, 122, 46, 1.4, 'castle'],
      [82, h - 125, 44, 2.5, 'waterfall'], [w - 84, h - 120, 48, 3.7, 'tower'],
      [w * 0.20, 48, 34, 4.1, 'tree'], [w * 0.80, 48, 36, 5.2, 'waterfall'],
      [44, h * 0.50, 32, 0.9, 'tree'], [w - 44, h * 0.50, 34, 2.9, 'castle']
    ];
    for (const [ix, iy, rad, ph, kind] of islets) {
      const bob = Math.sin(animPhase * 1.3 + ph) * 6;
      ctx.save();
      ctx.translate(ix, iy + bob);

      // Soft sunlit cloud cushion drifting beneath islet
      ctx.fillStyle = reg.id === 'sombravia' ? 'rgba(90,45,140,0.34)' : 'rgba(248,246,255,0.45)';
      ctx.beginPath();
      ctx.arc(-rad * 0.55, rad * 0.55, rad * 0.42, 0, Math.PI * 2);
      ctx.arc(rad * 0.45, rad * 0.62, rad * 0.36, 0, Math.PI * 2);
      ctx.fill();

      // Faceted 2-tone rocky floating spire underside
      ctx.fillStyle = shadeHex(reg.cliffColor || '#3D322A', 0.78);
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(-rad, 0);
      ctx.lineTo(-rad * 0.55, rad * 0.92);
      ctx.lineTo(0, rad * 1.38);
      ctx.lineTo(rad * 0.55, rad * 0.90);
      ctx.lineTo(rad, 0);
      ctx.closePath();
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = reg.cliffColor || '#4C3D33';
      ctx.beginPath();
      ctx.moveTo(-rad, 0); ctx.lineTo(-rad * 0.12, rad * 1.25); ctx.lineTo(0, 0); ctx.closePath();
      ctx.fill();

      // Mini cascading waterfall off islet edge
      if (kind === 'waterfall' || kind === 'castle') {
        const shim = (animPhase * 18 + ph * 9) % 14;
        ctx.fillStyle = 'rgba(114,239,221,0.82)';
        ctx.fillRect(-5, 4, 10, rad * 1.15);
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(0, 6 + shim * 0.2); ctx.lineTo(0, rad * 1.15); ctx.stroke();
      }

      // Lush top turf
      ctx.fillStyle = reg.groundB;
      ctx.beginPath(); ctx.ellipse(0, 0, rad, rad * 0.42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // Miniature Mokaya castle / crystal / tree on satellite island
      if (kind === 'tower' || kind === 'castle') {
        ctx.fillStyle = reg.id === 'tintopolis' ? '#E4E4E4' : reg.id === 'sombravia' ? '#3C096C' : '#F4E7D1';
        ctx.fillRect(-10, -rad * 0.65, 20, rad * 0.62); ctx.strokeRect(-10, -rad * 0.65, 20, rad * 0.62);
        ctx.fillStyle = reg.accent || '#FFC24D';
        ctx.beginPath(); ctx.moveTo(-13, -rad * 0.65); ctx.lineTo(0, -rad * 1.08); ctx.lineTo(13, -rad * 0.65); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#FFE57F'; ctx.fillRect(-3, -rad * 0.45, 6, 8);
      } else if (reg.id === 'constelaria' || reg.id === 'arbol_original' || reg.id === 'sombravia' || reg.id === 'picasia') {
        ctx.fillStyle = reg.accent;
        ctx.beginPath(); ctx.moveTo(0, -rad * 0.98); ctx.lineTo(rad * 0.28, -rad * 0.14); ctx.lineTo(-rad * 0.28, -rad * 0.14); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = '#5C3A21'; ctx.fillRect(-3, -rad * 0.55, 6, rad * 0.5);
        ctx.fillStyle = reg.id === 'tintopolis' ? '#BDBDBD' : '#39A96B';
        ctx.beginPath(); ctx.arc(-6, -rad * 0.58, rad * 0.25, 0, Math.PI * 2); ctx.arc(6, -rad * 0.58, rad * 0.25, 0, Math.PI * 2); ctx.arc(0, -rad * 0.72, rad * 0.30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawWorldEnvironmentBase(reg, animPhase) {
    const w = WORLD_W, h = WORLD_H;
    const cx = w / 2, cy = h / 2;

    // 1. Rich Sky / Ocean / Cosmic Backdrop
    const bgGrad = ctx.createRadialGradient(cx, cy, 120, cx, cy, w * 0.74);
    bgGrad.addColorStop(0, shadeHex(reg.waterOrVoid || '#0F1B2B', 1.48));
    bgGrad.addColorStop(1, reg.waterOrVoid || '#0F1B2B');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    if (reg.hasWaterMoat || reg.isSportsZone) {
      ctx.strokeStyle = reg.id === 'marea_viva' ? 'rgba(176,248,255,0.34)' : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 2.6;
      const rip = Math.sin(animPhase * 1.15) * 16;
      for (let row = 0; row <= 12; row++) {
        const y = 26 + row * (h / 12);
        for (let col = 0; col <= 11; col++) {
          const x = 32 + col * (w / 11) + (row % 2 === 0 ? rip : -rip);
          ctx.beginPath();
          ctx.arc(x, y, 22, 0.2, Math.PI - 0.2);
          ctx.stroke();
        }
      }
      // Sea foam shimmer around island cliff
      ctx.strokeStyle = `rgba(215,250,255,${0.36 + Math.sin(animPhase * 1.7) * 0.1})`;
      ctx.lineWidth = 11;
      ctx.beginPath(); ctx.roundRect(14, 14, w - 28, h - 28, 68); ctx.stroke();
    } else {
      for (let i = 0; i < 84; i++) {
        const sx = (i * 277 + 53) % w;
        const sy = (i * 193 + 37) % h;
        const tw = 0.25 + 0.65 * ((Math.sin(animPhase * 2.1 + i * 0.9) + 1) * 0.5);
        ctx.fillStyle = reg.id === 'tintopolis'
          ? `rgba(240,240,240,${tw * 0.35})`
          : reg.id === 'arbol_original'
          ? `rgba(255,194,77,${tw * 0.85})`
          : `rgba(230,217,255,${tw * 0.78})`;
        ctx.beginPath(); ctx.arc(sx, sy, i % 4 === 0 ? 3.5 : 2, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Floating decorative mini-islets on outer perimeter
    drawFloatingIslets(reg, animPhase, w, h);

    // 2. Multi-Tier 3D Island Cliff Base + Rock Strata + Hanging Vines
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.beginPath(); ctx.roundRect(22, 54, w - 44, h - 42, 64); ctx.fill();

    ctx.fillStyle = shadeHex(reg.cliffColor || '#42362B', 0.70);
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 3.2;
    ctx.beginPath(); ctx.roundRect(26, 42, w - 52, h - 46, 58); ctx.fill(); ctx.stroke();

    ctx.fillStyle = reg.cliffColor || '#42362B';
    ctx.beginPath(); ctx.roundRect(28, 32, w - 56, h - 50, 56); ctx.fill(); ctx.stroke();

    // Rock striations & hanging cliff vines along southern cliff face
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 3;
    for (let sx = 92; sx < w - 92; sx += 30) {
      ctx.beginPath(); ctx.moveTo(sx, h - 38); ctx.lineTo(sx + 6, h - 10); ctx.stroke();
      if (sx % 60 === 32 && reg.id !== 'tintopolis') {
        ctx.strokeStyle = reg.id === 'sombravia' ? '#7B2CBF' : '#2D9B59';
        ctx.lineWidth = 3.6;
        ctx.beginPath(); ctx.moveTo(sx + 14, h - 36); ctx.quadraticCurveTo(sx + 10, h - 22, sx + 16, h - 9); ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 3;
      }
    }

    // 3. Main District Turf / Stone Terrace Surface
    const grad = ctx.createRadialGradient(cx, cy, 40, cx, cy, w * 0.64);
    grad.addColorStop(0, reg.groundB);
    grad.addColorStop(0.75, reg.groundA);
    grad.addColorStop(1, shadeHex(reg.groundA, 0.82));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(30, 24, w - 60, h - 62, 54); ctx.fill();

    // Biome-specific ground detailing (mosaic plazas, roots, water lagoons, halftone stipples, neon equalizer)
    if (reg.id === 'plaza_infinita') {
      // Reference illustration radial garden hedges & stone promenade rings
      ctx.strokeStyle = 'rgba(255,222,148,0.24)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, cy - 12, 340, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy - 12, 460, 0, Math.PI * 2); ctx.stroke();
      for (const [gx, gy] of [[420, 320], [1380, 320], [420, 860], [1380, 860]]) {
        ctx.fillStyle = 'rgba(30, 126, 152, 0.55)'; ctx.strokeStyle = '#E5D3B3'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(gx, gy, 76, 42, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4CC37A';
        ctx.beginPath(); ctx.arc(gx - 38, gy, 10, 0, Math.PI * 2); ctx.arc(gx + 38, gy, 10, 0, Math.PI * 2); ctx.fill();
      }
    } else if (reg.id === 'picasia') {
      const pal = ['#FFB703', '#E97893', '#2EC4B6', '#6C63FF'];
      for (let i = 0; i < 42; i++) {
        const px = 110 + ((i * 317 + 57) % (w - 220));
        const py = 95 + ((i * 233 + 43) % (h - 190));
        const sz = 32 + (i % 3) * 14;
        ctx.save(); ctx.translate(px, py); ctx.rotate((i * 19 * Math.PI) / 180);
        ctx.fillStyle = pal[i % pal.length] + '35';
        ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.roundRect(-sz / 2, -sz / 2, sz, sz, 5); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    } else if (reg.id === 'tintopolis') {
      // Vintage rubber-hose halftone stipples + filmstrip promenade rail
      ctx.strokeStyle = 'rgba(245,245,245,0.22)'; ctx.lineWidth = 2;
      for (let fx = 70; fx < w - 70; fx += 36) {
        ctx.strokeRect(fx, 36, 20, 12);
        ctx.strokeRect(fx, h - 54, 20, 12);
      }
      for (let i = 0; i < 46; i++) {
        const px = 95 + ((i * 263 + 41) % (w - 190));
        const py = 85 + ((i * 197 + 61) % (h - 170));
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.09)' : 'rgba(0,0,0,0.16)';
        ctx.beginPath(); ctx.ellipse(px, py, 36, 18, 0, 0, Math.PI * 2); ctx.fill();
      }
    } else if (reg.id === 'rhythm_hood') {
      ctx.strokeStyle = 'rgba(255,61,154,0.15)'; ctx.lineWidth = 1.6;
      for (let gx = 120; gx < w - 120; gx += 110) {
        ctx.beginPath(); ctx.moveTo(gx, 60); ctx.lineTo(gx, h - 80); ctx.stroke();
      }
      for (let gy = 100; gy < h - 100; gy += 100) {
        ctx.beginPath(); ctx.moveTo(80, gy); ctx.lineTo(w - 80, gy); ctx.stroke();
      }
    } else if (reg.id === 'marea_viva') {
      [[w * 0.34, h * 0.45], [w * 0.66, h * 0.45], [w * 0.50, h * 0.67], [w * 0.25, h * 0.72], [w * 0.75, h * 0.72]].forEach(([lx, ly], i) => {
        ctx.fillStyle = 'rgba(14,72,96,0.65)';
        ctx.strokeStyle = 'rgba(166,244,255,0.44)'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.ellipse(lx, ly, 96 + (i % 3) * 10, 44, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      });
    } else if (reg.id === 'artelia') {
      ctx.strokeStyle = 'rgba(255,214,128,0.22)'; ctx.lineWidth = 2.2;
      for (let rx = 180; rx < w - 180; rx += 150) {
        for (let ry = 140; ry < h - 140; ry += 130) {
          ctx.strokeRect(rx - 44, ry - 44, 88, 88);
          ctx.beginPath(); ctx.arc(rx, ry, 18, 0, Math.PI * 2); ctx.stroke();
        }
      }
    } else if (reg.id === 'bosque_olvidado' || reg.id === 'sombravia') {
      const veinCol = reg.id === 'sombravia' ? 'rgba(157,78,221,0.26)' : 'rgba(114,239,221,0.26)';
      ctx.strokeStyle = veinCol; ctx.lineWidth = 6;
      for (let i = 0; i < 8; i++) {
        const a = (i * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(cx + Math.cos(a + 0.3) * 320, cy + Math.sin(a + 0.3) * 210, cx + Math.cos(a) * 680, cy + Math.sin(a) * 440);
        ctx.stroke();
      }
    } else {
      for (let i = 0; i < 40; i++) {
        const px = 100 + ((i * 307 + 71) % (w - 200));
        const py = 95 + ((i * 227 + 41) % (h - 190));
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.065)' : 'rgba(0,0,0,0.085)';
        ctx.beginPath(); ctx.ellipse(px, py, 46 + (i % 4) * 14, 24 + (i % 3) * 8, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Scattered wildflowers, clover & flagstone pebbles across turf
    for (let i = 0; i < 55; i++) {
      const fx = 88 + ((i * 389 + 47) % (w - 176));
      const fy = 78 + ((i * 271 + 31) % (h - 165));
      if (reg.id === 'tintopolis') {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.22)';
        ctx.beginPath(); ctx.arc(fx, fy, 3.2, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = i % 3 === 0 ? '#FFC24D88' : i % 3 === 1 ? '#FFFFFF66' : reg.accent + '77';
        ctx.beginPath(); ctx.arc(fx, fy, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Terrace rim carved stone balustrade with corner posts
    ctx.strokeStyle = reg.id === 'tintopolis' ? '#B0B0B0' : reg.id === 'artelia' ? '#F0DEC0' : reg.id === 'sombravia' ? '#9D4EDD' : reg.accent + 'CC';
    ctx.lineWidth = 7.5;
    ctx.beginPath(); ctx.roundRect(30, 24, w - 60, h - 62, 54); ctx.stroke();
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(34, 28, w - 68, h - 70, 50); ctx.stroke();

    // Billowing Clouds & Multi-Ribbon Cascading Waterfalls (matching reference archipelago!)
    if (reg.hasCloudsBorder || reg.id === 'plaza_infinita' || reg.id === 'bosque_olvidado' || reg.id === 'arbol_original' || reg.id === 'marea_viva') {
      const drift = Math.sin(animPhase * 0.55) * 10;
      if (reg.hasCloudsBorder) {
        const spots = [
          [75, 96], [260, 34], [w - 260, 34], [w - 75, 110],
          [72, h - 95], [300, h - 26], [w - 300, h - 26], [w - 72, h - 98]
        ];
        spots.forEach(([px, py], idx) => {
          const cxp = px + (idx % 2 === 0 ? drift : -drift);
          ctx.fillStyle = reg.id === 'constelaria' ? 'rgba(248,240,255,0.88)' : 'rgba(248,246,252,0.84)';
          ctx.strokeStyle = 'rgba(183,176,230,0.45)'; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(cxp - 26, py, 34, 0, Math.PI * 2);
          ctx.arc(cxp, py - 12, 44, 0, Math.PI * 2);
          ctx.arc(cxp + 26, py + 3, 32, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
        });
      }
      const falls = reg.id === 'plaza_infinita' || reg.id === 'arbol_original'
        ? [w * 0.16, w * 0.34, w * 0.50, w * 0.66, w * 0.84]
        : [w * 0.24, w * 0.50, w * 0.76];
      falls.forEach(fx => {
        const shim = (animPhase * 22) % 20;
        ctx.fillStyle = reg.id === 'arbol_original' ? 'rgba(154,230,255,0.84)' : 'rgba(111,208,232,0.82)';
        ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(fx - 24, h - 46, 48, 56, 14); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.moveTo(fx - 12, h - 40 + shim * 0.3); ctx.lineTo(fx - 12, h - 2);
        ctx.moveTo(fx, h - 36 + shim * 0.2); ctx.lineTo(fx, h);
        ctx.moveTo(fx + 12, h - 38 + shim * 0.35); ctx.lineTo(fx + 12, h - 3);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.beginPath(); ctx.ellipse(fx, h, 38, 10, 0, 0, Math.PI * 2); ctx.fill();
      });
    }

    // 4. Paved Stone / Canal Bridge / Boardwalk / Neon Avenues to every Gate
    const isBoardwalk = reg.id === 'marea_viva' || reg.id === 'bosque_olvidado';
    const isUrban = reg.id === 'rhythm_hood' || reg.id === 'arena_viva';
    const roadW = isUrban ? 70 : 64;
    for (const g of reg.gates) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(26,26,26,0.62)'; ctx.lineWidth = roadW + 12;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(g.x, g.y); ctx.stroke();

      ctx.strokeStyle = reg.id === 'rhythm_hood' ? '#332645' : reg.path; ctx.lineWidth = roadW;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(g.x, g.y); ctx.stroke();

      ctx.strokeStyle = reg.id === 'rhythm_hood' ? 'rgba(255,61,154,0.55)' : reg.id === 'picasia' ? 'rgba(255,183,3,0.44)' : 'rgba(255,255,255,0.22)';
      ctx.lineWidth = isUrban ? 5.5 : 34;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(g.x, g.y); ctx.stroke();

      // Stepping flagstones / wooden planks & roadside lantern dots
      const dx = g.x - cx, dy = g.y - cy;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const steps = Math.max(4, Math.floor(dist / 34));
      const nx = -dy / dist, ny = dx / dist;
      ctx.strokeStyle = isBoardwalk ? 'rgba(26,26,26,0.42)' : 'rgba(26,26,26,0.18)';
      ctx.lineWidth = 2.4;
      for (let i = 1; i < steps; i++) {
        const px = cx + dx * (i / steps), py = cy + dy * (i / steps);
        ctx.beginPath();
        ctx.moveTo(px - nx * 25, py - ny * 25);
        ctx.lineTo(px + nx * 25, py + ny * 25);
        ctx.stroke();
        if (i % 4 === 2 && dist > 260) {
          ctx.fillStyle = reg.id === 'tintopolis' ? '#F5F5F5' : '#FFC24D';
          ctx.beginPath();
          ctx.arc(px - nx * 35, py - ny * 35, 3.2, 0, Math.PI * 2);
          ctx.arc(px + nx * 35, py + ny * 35, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 5. Plaza Infinita Circular Canal Moat + 4 Stone Bridges + Sailing Boats (matches official illustration!)
    const pR = reg.plazaR || 215;
    const pcx = cx, pcy = cy - 12;
    if (reg.id === 'plaza_infinita') {
      ctx.fillStyle = '#1E7E98'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 3.2;
      ctx.beginPath(); ctx.arc(pcx, pcy, pR + 54, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(180,248,255,0.48)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(pcx, pcy, pR + 34 + Math.sin(animPhase * 2) * 3, 0, Math.PI * 2); ctx.stroke();

      // Tiny sailing boats ("Barcos y Balsas") gliding along the circular canal!
      for (let b = 0; b < 3; b++) {
        const ba = animPhase * 0.22 + b * ((Math.PI * 2) / 3);
        const bx = pcx + Math.cos(ba) * (pR + 28);
        const by = pcy + Math.sin(ba) * (pR + 28);
        ctx.save(); ctx.translate(bx, by); ctx.rotate(ba + Math.PI / 2);
        ctx.fillStyle = '#8D5B4C'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.ellipse(0, 0, 12, 5.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = b === 0 ? '#FFF6E5' : b === 1 ? '#FFC24D' : '#2EC4B6';
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, -14); ctx.lineTo(9, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      // 4 Ornate Arched Stone Bridges across circular canal
      for (const ang of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) {
        ctx.save(); ctx.translate(pcx, pcy); ctx.rotate(ang);
        ctx.fillStyle = '#E5D3B3'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.roundRect(pR - 8, -30, 72, 60, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#C9B18A';
        ctx.fillRect(pR - 6, -30, 68, 8); ctx.fillRect(pR - 6, 22, 68, 8);
        ctx.fillStyle = '#FFC24D';
        ctx.beginPath(); ctx.arc(pR + 2, -26, 3.5, 0, Math.PI * 2); ctx.arc(pR + 54, -26, 3.5, 0, Math.PI * 2);

  function drawHouse2D(h, animPhase) {

    [left + frontW * 0.22, left + frontW * 0.78].forEach(wx => {

        ctx.fillStyle = shadeHex(leaf, 1.25);

        ctx.fillStyle = shadeHex(leaf, 0.78);
        ctx.beginPath(); ctx.arc(-11 + sway * 0.7, -14, 15, 0, Math.PI * 2); ctx.arc(11 + sway * 0.7, -14, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = leaf;
        ctx.beginPath(); ctx.arc(sway, -26, 19, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = shadeHex(leaf, 1.25);
        ctx.beginPath(); ctx.arc(sway - 5, -31, 7.5, 0, Math.PI * 2); ctx.fill();
        if (regionId !== 'tintopolis') {
          ctx.fillStyle = '#FFC24D';

    } else if (fl.kind === 'crystal_root') {

      ctx.beginPath(); ctx.moveTo(-10, 4); ctx.lineTo(-7, -12); ctx.lineTo(-1, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, 4); ctx.lineTo(8, -10); ctx.lineTo(2, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(9, 4); ctx.lineTo(-9, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#FFFFFFAA';

  function drawEnemy2D(en, animPhase) {
    const r = en.isBoss ? 29 : 19;
    const hitT = en.hitAnim || 0;
    const hitP = hitT > 0 ? Math.min(1, hitT / 0.28) : 0;
    const bob = Math.sin(animPhase * 2.5 + en.x * 0.05) * 2.5;
    const jitterX = hitT > 0 ? Math.sin(hitP * 44) * 4.5 * hitP : 0;
    const sx = hitT > 0 ? 1 + 0.24 * hitP : 1;
    const sy = hitT > 0 ? 1 - 0.18 * hitP : 1;

    ctx.save();
    ctx.translate(en.x + jitterX, en.y + bob);
    ctx.fillStyle = 'rgba(0,0,0,0.24)';
    ctx.beginPath(); ctx.ellipse(0, r + 4, r * 0.85 * sx, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Expanding impact shockwave ring when hit
    if (hitT > 0.06) {
      const ringAlpha = Math.min(0.85, hitP * 0.9);
      ctx.strokeStyle = `rgba(255, 240, 185, ${ringAlpha.toFixed(2)})`;
      ctx.lineWidth = 3 * hitP;
      ctx.beginPath();
      ctx.arc(0, 0, r + (1 - hitP) * 20, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.save();
    if (hitT > 0) ctx.rotate(Math.sin(hitP * 26) * 0.15 * hitP);
    ctx.scale(sx, sy);

    const flashCol = en.flash > 0 ? (en.flash > 0.10 ? '#FFFFFF' : '#FFE0A3') : en.color;
    ctx.fillStyle = flashCol;
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.8;
    if (en.id === 'en_cube') {
      ctx.beginPath(); ctx.roundRect(-r, -r, r * 2, r * 2, 6); ctx.fill(); ctx.stroke();
      if (en.flash <= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath(); ctx.roundRect(-r + 3, -r + 3, r * 1.4, 5, 2); ctx.fill();
      }
    } else {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      if (en.flash <= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath(); ctx.ellipse(-r * 0.28, -r * 0.35, r * 0.42, r * 0.22, -0.45, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (en.id === 'boss_cat' || en.id === 'boss_cat2') {
      ctx.fillStyle = flashCol;
      ctx.beginPath(); ctx.moveTo(-r * 0.7, -r * 0.5); ctx.lineTo(-r * 0.9, -r * 1.25); ctx.lineTo(-r * 0.15, -r * 0.85); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.7, -r * 0.5); ctx.lineTo(r * 0.9, -r * 1.25); ctx.lineTo(r * 0.15, -r * 0.85); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (en.id === 'boss_dina' || en.id === 'boss_molo') {
      drawSmoothFlame(0, -r - 2, 14, 18, '#FFC24D', '#FF595E');
    } else if (en.id === 'boss_dino') {
      ctx.fillStyle = '#FFBE0B';
      for (const spx of [-10, 0, 10]) { ctx.beginPath(); ctx.moveTo(spx - 5, -r + 2); ctx.lineTo(spx, -r - 12); ctx.lineTo(spx + 5, -r + 2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }

    if (hitT > 0.08) {
      // Cartoon wincing "> <" eyes on impact
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.3;
      ctx.beginPath();
      ctx.moveTo(-10, -7); ctx.lineTo(-4, -3.5); ctx.lineTo(-10, 0);
      ctx.moveTo(10, -7); ctx.lineTo(4, -3.5); ctx.lineTo(10, 0);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#FFF';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(-6.2, -3.5, 4.1, 4.8, 0, 0, Math.PI * 2); ctx.ellipse(6.2, -3.5, 4.1, 4.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1A1A1A';
      ctx.beginPath(); ctx.arc(-6, -3.2, 1.8, 0, Math.PI * 2); ctx.arc(6, -3.2, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(-6.7, -4.1, 0.7, 0, Math.PI * 2); ctx.arc(5.3, -4.1, 0.7, 0, Math.PI * 2); ctx.fill();

      // Angry brows
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(-10.5, -9.5); ctx.lineTo(-2.5, -7); ctx.moveTo(10.5, -9.5); ctx.lineTo(2.5, -7); ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = '#141126'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-21, -r - 15, 42, 6, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = en.flash > 0 ? '#FFC24D' : '#FF595E';
    ctx.beginPath(); ctx.roundRect(-20, -r - 14, 40 * Math.max(0, en.hp / en.maxHp), 4, 2); ctx.fill();
    ctx.restore();
  }

  const PostFX = {
    bloomCanvas: null,
    bloomCtx: null,
    grainPattern: null,
    crtPattern: null,
    tick: 0,
    ensureGrainPattern() {
      if (this.grainPattern !== null) return this.grainPattern;
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const g = c.getContext && c.getContext('2d');
      if (!g) { this.grainPattern = false; return false; }
      let s = 1337;
      const rnd = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      for (let i = 0; i < 1400; i++) {
        const x = Math.floor(rnd() * 256);
        const y = Math.floor(rnd() * 256);
        const bright = rnd() > 0.5;
        g.fillStyle = bright ? 'rgba(255,244,218,0.032)' : 'rgba(18,12,10,0.036)';
        g.fillRect(x, y, 1, 1);
      }
      const pat = typeof ctx.createPattern === 'function' ? ctx.createPattern(c, 'repeat') : null;
      this.grainPattern = pat || false;
      return this.grainPattern;
    },
    ensureCrtPattern() {
      if (this.crtPattern !== null) return this.crtPattern;
      const c = document.createElement('canvas');
      c.width = 2; c.height = 3;
      const g = c.getContext && c.getContext('2d');
      if (!g) { this.crtPattern = false; return false; }
      g.fillStyle = 'rgba(0,0,0,0.14)';
      g.fillRect(0, 0, 2, 1);
      const pat = typeof ctx.createPattern === 'function' ? ctx.createPattern(c, 'repeat') : null;
      this.crtPattern = pat || false;
      return this.crtPattern;
    },
    drawBloomPass(vw, vh, alpha) {
      if (!canvas.width || !canvas.height || vw <= 0 || vh <= 0) return;
      const bw = Math.max(320, Math.floor(vw * 0.5));
      const bh = Math.max(180, Math.floor(vh * 0.5));
      if (!this.bloomCanvas) {
        this.bloomCanvas = document.createElement('canvas');
        this.bloomCtx = this.bloomCanvas.getContext && this.bloomCanvas.getContext('2d');
      }
      if (!this.bloomCtx) return;
      if (this.bloomCanvas.width !== bw || this.bloomCanvas.height !== bh) {
        this.bloomCanvas.width = bw;
        this.bloomCanvas.height = bh;
      }
      const bCtx = this.bloomCtx;
      bCtx.clearRect(0, 0, bw, bh);
      bCtx.save();
      bCtx.imageSmoothingEnabled = true;
      bCtx.imageSmoothingQuality = 'high';
      if ('filter' in bCtx) bCtx.filter = 'blur(6px) brightness(1.06)';
      bCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, bw, bh);
      bCtx.restore();

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha;
      ctx.drawImage(this.bloomCanvas, 0, 0, bw, bh, 0, 0, vw, vh);
      ctx.restore();
    },
    drawVignette(vw, vh, edgeAlpha, midAlpha = 0.08) {
      const cx = vw * 0.5, cy = vh * 0.5;
      const innerR = Math.min(vw, vh) * 0.38;
      const outerR = Math.hypot(vw, vh) * 0.60;
      const vg = ctx.createRadialGradient(cx, cy, innerR, cx, cy, outerR);
      vg.addColorStop(0, 'rgba(10,6,14,0)');
      vg.addColorStop(0.62, `rgba(12,8,16,${midAlpha})`);
      vg.addColorStop(1, `rgba(8,5,12,${edgeAlpha})`);
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, vw, vh);
    }
  };

  function applyPostProcessing(reg, vw, vh) {
    const mode = state.postFxMode || 'cuphead';
    if (mode === 'off' || vw <= 0 || vh <= 0) return;
    PostFX.tick++;
    ctx.save();

    if (mode === 'cuphead') {
      // 1. Bloom suave de alta resolución (sin lavar contornos)
      PostFX.drawBloomPass(vw, vh, 0.085);

      // 2. Baño cálido sutil estilo Technicolor años 30
      ctx.fillStyle = reg.id === 'tintopolis'
        ? 'rgba(235, 224, 198, 0.032)'
        : 'rgba(255, 212, 148, 0.026)';
      ctx.fillRect(0, 0, vw, vh);

      // 3. Micro-parpadeo suave de proyector
      const flicker = 0.008 * (0.5 + 0.5 * Math.sin(runtime.animPhase * 29 + Math.cos(runtime.animPhase * 11)));
      if (flicker > 0.002) {
        ctx.fillStyle = `rgba(255, 240, 205, ${flicker.toFixed(4)})`;
        ctx.fillRect(0, 0, vw, vh);
      }

      // 4. Grano analógico fino (256x256, sin bloques gruesos) + rayón sutil ocasional
      const grainPat = PostFX.ensureGrainPattern();
      if (grainPat) {
        const ox = (PostFX.tick * 43) % 256;
        const oy = (PostFX.tick * 61) % 256;
        ctx.save();
        ctx.translate(-ox, -oy);
        ctx.fillStyle = grainPat;
        ctx.fillRect(ox, oy, vw + 256, vh + 256);
        ctx.restore();
      }
      if (PostFX.tick % 16 < 3) {
        const sx = ((PostFX.tick * 197 + 43) % Math.max(1, Math.floor(vw)));
        ctx.strokeStyle = 'rgba(255, 246, 225, 0.055)';
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx + Math.sin(PostFX.tick) * 1.5, vh);
        ctx.stroke();
      }

      // 5. Viñeteado cinematográfico nítido
      PostFX.drawVignette(vw, vh, reg.dark ? 0.54 : 0.40, 0.08);
    } else if (mode === 'crt') {
      PostFX.drawBloomPass(vw, vh, 0.095);

      const crtPat = PostFX.ensureCrtPattern();
      if (crtPat) {
        ctx.fillStyle = crtPat;
        ctx.fillRect(0, 0, vw, vh);
      }

      const sheen = ctx.createLinearGradient(0, 0, 0, vh * 0.42);
      sheen.addColorStop(0, 'rgba(210, 235, 255, 0.04)');
      sheen.addColorStop(1, 'rgba(210, 235, 255, 0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, vw, vh * 0.42);

      PostFX.drawVignette(vw, vh, 0.56, 0.12);
    } else if (mode === 'bloom') {
      PostFX.drawBloomPass(vw, vh, 0.16);
      PostFX.drawVignette(vw, vh, 0.28, 0.06);
    }

    ctx.restore();
  }

  function syncPostFxBtn() {
    const ico = document.getElementById('fxIco');
    const lbl = document.getElementById('fxLbl');
    const btn = document.getElementById('fxBtn');
    const spec = POSTFX_MODES.find(m => m.id === state.postFxMode) || POSTFX_MODES[0];
    if (ico) ico.textContent = spec.ico;
    if (lbl) lbl.textContent = spec.short;
    if (btn) btn.style.opacity = spec.id === 'off' ? '0.68' : '1';
  }

  function cyclePostFx() {
    const idx = POSTFX_MODES.findIndex(m => m.id === state.postFxMode);
    const next = POSTFX_MODES[(idx + 1) % POSTFX_MODES.length];
    state.postFxMode = next.id;
    syncPostFxBtn();
    saveGame(false);
    showToast(`${next.ico} Filtro: ${next.name}`);
  }

  function renderWorld() {
    const dpr = Math.min(2.5, Math.max(window.devicePixelRatio || 1, 2));
    const vw = canvas.clientWidth;
    const vh = canvas.clientHeight;
    if (canvas.width !== Math.floor(vw * dpr) || canvas.height !== Math.floor(vh * dpr)) {
      canvas.width = Math.floor(vw * dpr);
      canvas.height = Math.floor(vh * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    const reg = REGIONS[state.regionId];
    const camZoom = Math.min(vw, vh) < 500 ? 0.94 : 1.08;
    const shakeAmt = runtime.shakeTimer > 0 ? runtime.shakeMag * (runtime.shakeTimer / 0.2) : 0;
    const shakeX = shakeAmt > 0 ? Math.sin(runtime.animPhase * 41) * shakeAmt : 0;
    const shakeY = shakeAmt > 0 ? Math.cos(runtime.animPhase * 37) * shakeAmt * 0.8 : 0;
    const camX = Math.max(0, Math.min(WORLD_W - vw / camZoom, state.px - vw / (2 * camZoom))) + shakeX;
    const camY = Math.max(0, Math.min(WORLD_H - vh / camZoom, state.py - vh / (2 * camZoom))) + shakeY;

    ctx.fillStyle = reg.waterOrVoid || reg.groundA;
    ctx.fillRect(0, 0, vw, vh);

    ctx.save();
    ctx.scale(camZoom, camZoom);
    ctx.translate(-camX, -camY);

    // 1. Terreno base, acantilado 3D, avenidas, plazas temáticas, trenes y cascadas
    drawWorldEnvironmentBase(reg, runtime.animPhase);

    // 2. Landmarks a ras de suelo
    for (const lm of (reg.landmarks || [])) {
      if (GROUND_LANDMARK_KINDS.has(lm.kind)) {
        drawLandmark2D(lm, runtime.animPhase);
      }
    }

    // 3. Puzzle de Foskay y Portales entre regiones
    if (reg.puzzle) {
      const solved = state.solvedPuzzles.includes(reg.puzzle.id);
      ctx.fillStyle = solved ? '#4CC37A' : '#FF6A3D';
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(reg.puzzle.x, reg.puzzle.y, 24, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); ctx.ellipse(reg.puzzle.x - 6, reg.puzzle.y - 8, 9, 4.5, -0.4, 0, Math.PI * 2); ctx.fill();
      if (!solved) drawSmoothFlame(reg.puzzle.x, reg.puzzle.y + 4, 14, 18, '#FFC24D', '#FF595E');
      const pTxt = solved ? '✓ ' + reg.puzzle.name : '🔥 Usa Foskay';
      ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(15,11,28,0.92)';
      ctx.strokeText(pTxt, reg.puzzle.x, reg.puzzle.y - 33);
      ctx.fillStyle = '#F4E7D1';
      ctx.fillText(pTxt, reg.puzzle.x, reg.puzzle.y - 33);
    }

    for (const g of reg.gates) {
      const near = runtime.nearbyGate && runtime.nearbyGate.id === g.id;
      drawGateArchway(g, near, runtime.animPhase);
    }

    // 4. Cola ordenada por profundidad Y (2.5D)
    const drawList = [];
    for (const h of (reg.houses || [])) {
      drawList.push({ y: h.y + h.h * 0.42, draw: () => drawHouse2D(h, runtime.animPhase) });
    }
    for (const lm of (reg.landmarks || [])) {
      if (!GROUND_LANDMARK_KINDS.has(lm.kind)) {
        drawList.push({ y: lm.y + (lm.h || 120) * 0.40, draw: () => drawLandmark2D(lm, runtime.animPhase) });
      }
    }
    for (const p of (reg.props || [])) {
      drawList.push({ y: p.y, draw: () => drawProp2D(p, runtime.animPhase) });
    }
    for (const fl of buildFloraForRegion(reg.id)) {
      drawList.push({ y: fl.y, draw: () => drawBiomeFlora(fl, runtime.animPhase, reg.id) });
    }
    for (const pk of (reg.pickups || [])) {
      if (state.collectedPickups.includes(pk.id)) continue;
      drawList.push({
        y: pk.y,
        draw: () => {
          const bob = Math.sin(runtime.animPhase * 1.8 + pk.x) * 4;
          const pr = pk.bookId ? 15 : 11.5;
          ctx.fillStyle = pk.bookId ? '#2EC4B6' : ITEMS[pk.itemId].color;
          ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.arc(pk.x, pk.y + bob, pr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          ctx.beginPath(); ctx.ellipse(pk.x - 3, pk.y + bob - 4, pr * 0.42, pr * 0.22, -0.4, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#FFF'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center';
          ctx.fillText(pk.bookId ? '📖' : '✦', pk.x, pk.y + bob + 4);
        }
      });
    }
    for (const n of (reg.npcs || [])) {
      drawList.push({
        y: n.y + 22,
        draw: () => {
          const distToBoxy = Math.hypot(n.x - state.px, n.y - state.py);
          const isGreeting = distToBoxy < 120;
          const greetWave = isGreeting ? Math.sin(runtime.animPhase * 3.4 + n.x * 0.02) : 0;
          const greetPulse = isGreeting ? 1 + 0.075 * (0.5 + 0.5 * greetWave) : 1;
          const scaleX = isGreeting ? greetPulse * (1 - 0.03 * greetWave) : 1;
          const scaleY = isGreeting ? greetPulse * (1 + 0.04 * greetWave) : 1;
          const bob = Math.sin(runtime.animPhase + n.x * 0.01) * (isGreeting ? 3.8 : 2.5);

          ctx.fillStyle = 'rgba(0,0,0,0.26)';
          ctx.beginPath(); ctx.ellipse(n.x, n.y + 22, 17 * scaleX, 6.2, 0, 0, Math.PI * 2); ctx.fill();

          ctx.save();
          ctx.translate(n.x, n.y + bob);
          ctx.scale(scaleX, scaleY);
          if (isGreeting) {
            ctx.strokeStyle = 'rgba(255, 194, 77, 0.62)'; ctx.lineWidth = 2.2;
            ctx.beginPath(); ctx.arc(0, 0, 23 + Math.abs(greetWave) * 2.5, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.fillStyle = n.color; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.arc(0, 0, 18.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          // Cel-shading highlight on top-left
          ctx.fillStyle = 'rgba(255,255,255,0.24)';
          ctx.beginPath(); ctx.ellipse(-5, -8, 8, 4.2, -0.45, 0, Math.PI * 2); ctx.fill();

          if (isGreeting) {
            const handAngle = -0.5 + greetWave * 0.45;
            const hx = 17.5 + Math.cos(handAngle) * 6, hy = -6 + Math.sin(handAngle) * 7;
            ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(hx, hy, 4.8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          }
          const lookX = isGreeting ? Math.max(-2.5, Math.min(2.5, (state.px - n.x) * 0.025)) : 0;
          const lookY = isGreeting ? Math.max(-2.0, Math.min(2.0, (state.py - n.y) * 0.02)) : 0;
          // Expressive white eye sclera + dark pupils + specular glints
          ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.ellipse(-5.2 + lookX * 0.7, -3.5 + lookY * 0.7, 3.6, 4.4, 0, 0, Math.PI * 2);
          ctx.ellipse(5.2 + lookX * 0.7, -3.5 + lookY * 0.7, 3.6, 4.4, 0, 0, Math.PI * 2);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#1A1A1A';
          ctx.beginPath();
          ctx.arc(-5 + lookX, -3.2 + lookY, 1.85, 0, Math.PI * 2);
          ctx.arc(5 + lookX, -3.2 + lookY, 1.85, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(-5.6 + lookX, -4.1 + lookY, 0.75, 0, Math.PI * 2);
          ctx.arc(4.4 + lookX, -4.1 + lookY, 0.75, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.arc(lookX * 0.4, 4.5 + lookY * 0.3, 4.2, 0.15, Math.PI - 0.15); ctx.stroke();
          ctx.restore();

          const lblTxt = isGreeting ? `👋 ${n.name}` : n.name;
          ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center';
          ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(15,11,28,0.92)';
          ctx.strokeText(lblTxt, n.x, n.y - 29 + bob);
          ctx.fillStyle = '#FFC24D';
          ctx.fillText(lblTxt, n.x, n.y - 29 + bob);
        }
      });
    }
    for (const en of runtime.enemies) {
      drawList.push({ y: en.y + 24, draw: () => drawEnemy2D(en, runtime.animPhase) });
    }
    drawList.push({
      y: state.py + 26,
      draw: () => drawBoxy(state.px, state.py, runtime.animPhase, state.dir, runtime.actionKind, runtime.actionTimer, state.exhausted, runtime.foskayTimer, runtime.boxyHurtTimer, runtime.hitFlashTimer, runtime.invulnTimer, runtime.isRunning)
    });

    drawList.sort((a, b) => a.y - b.y);
    for (const item of drawList) item.draw();

    // 5. Partículas, textos flotantes y niebla oscura
    for (const p of runtime.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const b of runtime.banners) {
      ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = b.color;
      ctx.fillText(b.text, b.x, b.y);
    }

    // 5.5 Ambient Mokaya Motes & Fleet of Hot-Air Balloons ("Globos Aerostáticos")
    for (let i = 0; i < 24; i++) {
      const mx = (i * 239 + Math.sin(runtime.animPhase * 0.6 + i) * 35 + runtime.animPhase * 8) % WORLD_W;
      const my = (i * 157 + Math.cos(runtime.animPhase * 0.7 + i) * 28) % WORLD_H;
      const a = 0.28 + 0.35 * Math.sin(runtime.animPhase * 2.4 + i);
      ctx.fillStyle = reg.id === 'tintopolis' ? `rgba(245,245,245,${a})` : `${reg.accent}${Math.round(a * 255).toString(16).padStart(2, '0')}`;
      ctx.beginPath(); ctx.arc(mx, my, i % 3 === 0 ? 3.2 : 2, 0, Math.PI * 2); ctx.fill();
    }
    if (reg.id === 'plaza_infinita' || reg.id === 'constelaria' || reg.id === 'artelia' || reg.id === 'marea_viva' || reg.id === 'picasia') {
      const balloons = [
        [200 + ((runtime.animPhase * 18) % (WORLD_W - 400)), 96 + Math.sin(runtime.animPhase * 1.1) * 16, reg.accent || '#FF6A3D', '#FFF3B0'],
        [WORLD_W - 220 - ((runtime.animPhase * 13) % (WORLD_W - 440)), 142 + Math.cos(runtime.animPhase * 0.9) * 14, '#2EC4B6', '#FFC24D']
      ];
      for (const [bx, by, bCol, stripe] of balloons) {
        ctx.save(); ctx.translate(bx, by);
        ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(0, 72, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(-7, 2); ctx.lineTo(-5, 16); ctx.moveTo(7, 2); ctx.lineTo(5, 16); ctx.stroke();
        ctx.fillStyle = '#8D5B4C'; ctx.fillRect(-6, 15, 12, 9); ctx.strokeRect(-6, 15, 12, 9);
        ctx.fillStyle = bCol;
        ctx.beginPath(); ctx.arc(0, -10, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = stripe; ctx.beginPath(); ctx.ellipse(0, -10, 7, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    if (reg.dark) {
      const lightR = runtime.foskayLightTimer > 0 ? 340 : 145;
      const gFog = ctx.createRadialGradient(state.px, state.py, lightR * 0.25, state.px, state.py, lightR);
      gFog.addColorStop(0, 'rgba(15,10,25,0)');
      gFog.addColorStop(1, 'rgba(12,8,20,0.84)');
      ctx.fillStyle = gFog;
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    }

    ctx.restore();
    if (runtime.hitFlashTimer > 0) {
      const dmgAlpha = Math.min(0.24, (runtime.hitFlashTimer / 0.24) * 0.22);
      const cx = vw * 0.5, cy = vh * 0.5;
      const dmgVig = ctx.createRadialGradient(cx, cy, Math.min(vw, vh) * 0.28, cx, cy, Math.hypot(vw, vh) * 0.62);
      dmgVig.addColorStop(0, 'rgba(255,60,60,0)');
      dmgVig.addColorStop(1, `rgba(225,52,62,${dmgAlpha.toFixed(3)})`);
      ctx.fillStyle = dmgVig;
      ctx.fillRect(0, 0, vw, vh);
    }
    applyPostProcessing(reg, vw, vh);
  }

  function syncHud() {
    document.getElementById('hudChispas').textContent = `✨ ${state.chispas}`;
    document.getElementById('hpFill').style.width = `${(state.hp / state.maxHp) * 100}%`;
    document.getElementById('hpVal').textContent = Math.round(state.hp);
    document.getElementById('stamFill').style.width = `${(state.stam / state.maxStam) * 100}%`;
    document.getElementById('stamFill').style.background = state.exhausted ? '#FFB703' : '#4CC37A';
    document.getElementById('stamLabel').textContent = state.exhausted ? 'FATIGA' : 'ESTAM.';
    document.getElementById('stamVal').textContent = Math.round(state.stam);
    document.getElementById('manaFill').style.width = `${(state.mana / state.maxMana) * 100}%`;
    document.getElementById('manaVal').textContent = Math.round(state.mana);
    document.getElementById('hudRegion').textContent = REGIONS[state.regionId].title.toUpperCase();
    document.getElementById('mapCounter').textContent = `${state.discoveredRegions.length}/11`;

    const tq = QUESTS.find(q => q.id === state.trackedQuest);
    if (tq) {
      const done = state.completedQuests.includes(tq.id);
      const ready = isQuestReady(tq);
      document.getElementById('hudQuestTitle').textContent = `MISIÓN: ${tq.title}`;
      document.getElementById('hudQuestSub').textContent = done ? 'Completada ✓' : ready ? '¡Lista para entregar!' : tq.desc;
    }

    const boss = runtime.enemies.find(e => e.isBoss);
    const bossBar = document.getElementById('bossBar');
    if (boss) {
      bossBar.style.display = 'block';
      document.getElementById('bossName').textContent = `JEFE: ${boss.name.toUpperCase()}`;
      document.getElementById('bossFill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
    } else {
      bossBar.style.display = 'none';
    }

    const btnRun = document.getElementById('btnRun');
    const lblRun = document.getElementById('runLabel');
    if (btnRun) btnRun.classList.toggle('active', Boolean(runtime.runToggle || runtime.isRunning));
    if (lblRun) lblRun.textContent = (runtime.runToggle || runtime.isRunning) ? 'Correr ON' : 'Correr';

    const btnInt = document.getElementById('btnInteract');
    const lblInt = document.getElementById('interactLabel');
    if (runtime.nearbyNpc) {
      btnInt.classList.add('ready'); lblInt.textContent = 'Hablar';
    } else if (runtime.nearbyGate) {
      btnInt.classList.add('ready'); lblInt.textContent = 'Puerta';
    } else {
      btnInt.classList.remove('ready'); lblInt.textContent = 'Acción';
    }

    const qsRow = document.getElementById('quickSlotsRow');
    const qsKey = state.quickSlots.map(id => `${id}:${state.inventory[id] || 0}`).join('|');
    if (runtime.lastQuickSlotsKey !== qsKey) {
      runtime.lastQuickSlotsKey = qsKey;
      qsRow.innerHTML = state.quickSlots.map((id, i) => {
        const sp = ITEMS[id];
        const qty = state.inventory[id] || 0;
        return `<button class="quick-pill" onclick="consumeItem('${id}')"><span>${i + 1}. ${sp ? sp.name.split(' ')[0] : id}</span><span class="qty">x${qty}</span></button>`;
      }).join('');
    }
  }

  window.completeQuest = completeQuest;
  window.renderModal = renderModal;
  window.saveGame = saveGame;
  window.cyclePostFx = cyclePostFx;
  window.runtime = runtime;
  syncPostFxBtn();

  let lastTs = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
    lastTs = now;
    stepSimulation(dt);
    renderWorld();
    syncHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
